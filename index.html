<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:'Open Sans', sans-serif;

    font-style:italic;

    font-weight:700;

}


html{

    width:100%;

    overflow-x:hidden;

}


body{

    width:100%;

    min-height:100vh;

    background:#000;

    color:#fff;

    overflow-x:hidden;

}


/* =====================================================
   ANIMAÇÕES
===================================================== */

@keyframes brilho-dourado{

    0%{
        opacity:.3;
    }

    50%{
        opacity:.8;
    }

    100%{
        opacity:.3;
    }

}


@keyframes float-up{

    0%{

        transform:
        translateY(100vh)
        translateX(0);

        opacity:0;

    }

    10%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{

        transform:
        translateY(-100vh)
        translateX(100px);

        opacity:0;

    }

}


@keyframes brilho-texto{

    0%{

        text-shadow:

        0 0 5px
        rgba(212,175,55,.4),

        0 0 12px
        rgba(212,175,55,.3),

        0 0 20px
        rgba(212,175,55,.2);

    }

    50%{

        text-shadow:

        0 0 8px
        rgba(212,175,55,.9),

        0 0 18px
        rgba(212,175,55,.8),

        0 0 30px
        rgba(212,175,55,.6);

    }

    100%{

        text-shadow:

        0 0 5px
        rgba(212,175,55,.4),

        0 0 12px
        rgba(212,175,55,.3),

        0 0 20px
        rgba(212,175,55,.2);

    }

}


@keyframes pulse-glow{

    0%,
    100%{

        box-shadow:
        0 0 15px
        rgba(212,175,55,.35);

    }

    50%{

        box-shadow:
        0 0 30px
        rgba(212,175,55,.65);

    }

}


@keyframes shimmer{

    0%{

        background-position:
        -1000px 0;

    }

    100%{

        background-position:
        1000px 0;

    }

}


/* =====================================================
   FUNDO
===================================================== */

.banner{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100vh;

    background:
    url("wallpaperbackspace.png")
    no-repeat
    center center;

    background-size:cover;

    opacity:.35;

    z-index:-3;

}


/* =====================================================
   OVERLAY DOURADO
===================================================== */

.golden-overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
    radial-gradient(
        circle at 50% 50%,
        rgba(212,175,55,.15) 0%,
        transparent 70%
    );

    pointer-events:none;

    z-index:-1;

    animation:
    brilho-dourado
    4s
    ease-in-out
    infinite;

}


/* =====================================================
   BRILHO LATERAL
===================================================== */

.glow-left{

    position:fixed;

    left:-200px;

    top:50%;

    width:400px;
    height:400px;

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.2) 0%,
        transparent 70%
    );

    border-radius:50%;

    filter:blur(60px);

    animation:
    brilho-dourado
    6s
    ease-in-out
    infinite;

    z-index:-1;

    pointer-events:none;

}


.glow-right{

    position:fixed;

    right:-200px;

    bottom:50px;

    width:400px;
    height:400px;

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.15) 0%,

    );

    brilho-dourado

}


/* =====================================================
   PARTÍCULAS
===================================================== */

    left:0;

    height:100%;

    z-index:0;

    pointer-events:none;

    overflow:hidden;

}


.particle{

    radial-gradient(

        #d4af37,
        #f5d76e

    0 0 10px

    float-up

/* =====================================================
   QUADRO DA GALERIA
===================================================== */

.carrossel{

    position:relative;

    height:500px;

    overflow:hidden;

    2px solid
    #d4af37;

    border-radius:26px;

    background:#050505;

    0 0 30px
    rgba(212,175,55,.4);

    touch-action:pan-y;

    cursor:grab;

}


/* =====================================================
   QUADRO SENDO ARRASTADO
===================================================== */

.carrossel:active{

    cursor:grabbing;

}


/* =====================================================
   FOTOS
===================================================== */

.carrossel img{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:contain;

    opacity:0;

    transition:
    opacity 1s ease;

    display:block;

.carrossel img.ativo{

<script>


/* =====================================================
   WHATSAPP
===================================================== */

function agendar(servico){

    const numeroWhatsApp =
        "5531998009842";


    const mensagem =
        `Olá! Gostaria de agendar: ${servico}`;


    const url =
        "https://wa.me/"
        + numeroWhatsApp
        + "?text="
        + encodeURIComponent(mensagem);


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   PARTÍCULAS
===================================================== */

const particlesContainer =
    document.getElementById(
        "particles"
    );


function criarParticula(){

    const particle =
        document.createElement("div");


    particle.className =
        "particle";


    const tamanho =
        Math.random() * 6 + 2;


    particle.style.width =
        tamanho + "px";


    particle.style.height =
        tamanho + "px";


    particle.style.left =
        Math.random()
        * window.innerWidth
        + "px";


    particle.style.bottom =
        "-10px";


    const duracao =
        Math.random() * 15 + 10;


    particle.style.animationDuration =
        duracao + "s";


    particle.style.animationDelay =
        Math.random() * 5
        + "s";


    particlesContainer.appendChild(
        particle
    );


    setTimeout(
        () => {

            particle.remove();

        },
        (duracao + 5) * 1000
    );

}


setInterval(
    criarParticula,
    500
);


for(
    let i = 0;
    i < 15;
    i++
){

    criarParticula();

}


/* =====================================================
   GALERIA
===================================================== */

let imagens = [];

let bolinhas = [];

let indice = 0;

let intervalo = null;


/* =====================================================
   CARREGAR GALERIA
===================================================== */

async function carregarGaleria(){

    const carrossel =
        document.getElementById(
            "carrossel"
        );


    const dots =
        document.getElementById(
            "bolinhas"
        );


    try{

        const resposta =
            await fetch(
                "./fotos.json?v="
                + Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!resposta.ok){

            throw new Error(
                "Não foi possível carregar fotos.json"
            );

        }


        const dados =
            await resposta.json();


        if(
            !dados ||
            !Array.isArray(dados.fotos)
        ){

            throw new Error(
                "fotos.json inválido"
            );

        }


        carrossel.innerHTML = "";

        dots.innerHTML = "";


        dados.fotos.forEach(
            (foto, i) => {


                let caminho =
                    String(foto).trim();


                if(
                    !caminho.startsWith("./") &&
                    !caminho.startsWith("/") &&
                    !caminho.startsWith("http")
                ){

                    caminho =
                        "./"
                        + caminho;

                }


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    caminho;


                img.alt =
                    "Trabalho Bia Nails";


                img.draggable =
                    false;


                if(
                    i === 0
                ){

                    img.classList.add(
                        "ativo"
                    );

                }


                img.addEventListener(
                    "error",
                    () => {

                        console.error(
                            "Erro ao carregar foto:",
                            caminho
                        );

                    }
                );


                carrossel.appendChild(
                    img
                );


                const dot =
                    document.createElement(
                        "span"
                    );


                if(
                    i === 0
                ){

                    dot.classList.add(
                        "ativa"
                    );

                }


                dot.addEventListener(
                    "click",
                    () => {

                        trocar(i);

                        reiniciarTemporizador();

                    }
                );


                dots.appendChild(
                    dot
                );

            }
        );


        imagens =
            carrossel.querySelectorAll(
                "img"
            );


        bolinhas =
            dots.querySelectorAll(
                "span"
            );


        indice = 0;


        if(
            imagens.length > 1
        ){

            iniciarTemporizador();

        }


        console.log(
            "Galeria carregada:",
            imagens.length,
            "fotos"
        );

    }


    catch(erro){

        console.error(
            "Erro na galeria:",
            erro
        );


        carrossel.innerHTML = `

            <div
                style="
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                text-align:center;
                padding:20px;
                color:#d4af37;
                "
            >

                Não foi possível carregar
                a galeria.

            </div>

        `;

    }

}


/* =====================================================
   TEMPORIZADOR — 8 SEGUNDOS
===================================================== */

function iniciarTemporizador(){

    pararTemporizador();


    intervalo =
        setInterval(
            proxima,
            8000
        );

}


/* =====================================================
   PARAR TEMPORIZADOR
===================================================== */

function pararTemporizador(){

    if(intervalo){

        clearInterval(
            intervalo
        );

        intervalo = null;

    }

}


/* =====================================================
   REINICIAR TEMPORIZADOR
===================================================== */

function reiniciarTemporizador(){

    if(
        imagens.length > 1
    ){

        iniciarTemporizador();

    }

}


/* =====================================================
   TROCAR FOTO
===================================================== */

function trocar(numero){

    if(
        !imagens.length
    ){

        return;

    }


    imagens[indice]
        .classList
        .remove(
            "ativo"
        );


    if(
        bolinhas[indice]
    ){

        bolinhas[indice]
            .classList
            .remove(
                "ativa"
            );

    }


    indice =
        numero;


    imagens[indice]
        .classList
        .add(
            "ativo"
        );


    if(
        bolinhas[indice]
    ){

        bolinhas[indice]
            .classList
            .add(
                "ativa"
            );

    }

}


/* =====================================================
   PRÓXIMA FOTO
===================================================== */

function proxima(){

    if(
        !imagens.length
    ){

        return;

    }


    trocar(
        (indice + 1)
        % imagens.length
    );

}


/* =====================================================
   FOTO ANTERIOR
===================================================== */

function anterior(){

    if(
        !imagens.length
    ){

        return;

    }


    trocar(
        (indice - 1 + imagens.length)
        % imagens.length
    );

}


/* =====================================================
   ARRASTAR COM DEDO
===================================================== */

let inicioX = 0;

let fimX = 0;


const carrossel =
    document.getElementById(
        "carrossel"
    );


carrossel.addEventListener(
    "touchstart",
    evento => {

        inicioX =
            evento.touches[0].clientX;

    },
    {
        passive:true
    }
);


carrossel.addEventListener(
    "touchend",
    evento => {

        fimX =
            evento.changedTouches[0].clientX;


        const distancia =
            fimX - inicioX;


        if(
            distancia < -50
        ){

            proxima();

            reiniciarTemporizador();

        }


        else if(
            distancia > 50
        ){

            anterior();

            reiniciarTemporizador();

        }

    },
    {
        passive:true
    }
);


/* =====================================================
   ARRASTAR COM MOUSE
===================================================== */

let mousePressionado =
    false;

let mouseInicioX =
    0;


carrossel.addEventListener(
    "mousedown",
    evento => {

        mousePressionado =
            true;

        mouseInicioX =
            evento.clientX;

    }
);


carrossel.addEventListener(
    "mouseup",
    evento => {

        if(
            !mousePressionado
        ){

            return;

        }


        mousePressionado =
            false;


        const distancia =
            evento.clientX
            - mouseInicioX;


        if(
            distancia < -50
        ){

            proxima();

            reiniciarTemporizador();

        }


        else if(
            distancia > 50
        ){

            anterior();

            reiniciarTemporizador();

        }

    }
);


carrossel.addEventListener(
    "mouseleave",
    () => {

        mousePressionado =
            false;

    }
);


/* =====================================================
   INICIAR GALERIA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        carregarGaleria();

    }
);


/* =====================================================
   SERVICE WORKER / PWA
===================================================== */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )

                .then(
                    registro => {

                        console.log(
                            "Bia Nails PWA ativo"
                        );

                        console.log(
                            "Service Worker:",
                            registro
                        );

                    }
                )

                .catch(
                    erro => {

                        console.log(
                            "Erro PWA:",
                            erro
                        );

                    }
                );

        }
    );

}

</script>
