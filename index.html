<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:'Open Sans', sans-serif;

    font-style:italic;
    font-weight:700;

}


body{

    background:#000;

    color:white;

    overflow-x:hidden;

}


/* =====================================================
   ANIMAÇÕES
===================================================== */

@keyframes brilho-dourado{

    0%{
        opacity:.3;
    }

    50%{
        opacity:.8;
    }

    100%{
        opacity:.3;
    }

}


@keyframes float-up{

    0%{

        transform:
        translateY(100vh)
        translateX(0);

        opacity:0;

    }

    10%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{

        transform:
        translateY(-100vh)
        translateX(100px);

        opacity:0;

    }

}


@keyframes pulse-glow{

    0%,100%{

        box-shadow:
        0 0 20px
        rgba(212,175,55,.5);

    }

    50%{

        box-shadow:
        0 0 40px
        rgba(212,175,55,.9);

    }

}


@keyframes shimmer{

    0%{
        background-position:-1000px 0;
    }

    100%{
        background-position:1000px 0;
    }

}


/* =====================================================
   PARTÍCULAS
===================================================== */

.particles{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    z-index:0;

    pointer-events:none;

    overflow:hidden;

}


.particle{

    position:absolute;

    width:4px;
    height:4px;

    background:
    radial-gradient(
        circle,
        #d4af37,
        #f5d76e
    );

    border-radius:50%;

    box-shadow:
    0 0 10px
    rgba(212,175,55,.8);

    animation:
    float-up
    linear
    infinite;

}


/* =====================================================
   FUNDO
===================================================== */

.banner{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100vh;

    background:
    url("wallpaperbackspace.png")
    no-repeat
    center center;

    background-size:cover;

    opacity:.35;

    z-index:-1;

}


/* =====================================================
   OVERLAY DOURADO
===================================================== */

.golden-overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
    radial-gradient(
        circle at 50% 50%,
        rgba(212,175,55,.15) 0%,
        transparent 70%
    );

    pointer-events:none;

    z-index:0;

    animation:
    brilho-dourado
    4s
    ease-in-out
    infinite;

}


/* =====================================================
   BRILHOS LATERAIS
===================================================== */

.glow-left{

    position:fixed;

    left:-200px;

    top:50%;

    width:400px;
    height:400px;

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.2) 0%,
        transparent 70%
    );

    border-radius:50%;

    filter:blur(60px);

    animation:
    brilho-dourado
    6s
    ease-in-out
    infinite;

    z-index:0;

    pointer-events:none;

}


.glow-right{

    position:fixed;

    right:-200px;

    bottom:50px;

    width:400px;
    height:400px;

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.15) 0%,
        transparent 70%
    );

    border-radius:50%;

    filter:blur(60px);

    animation:
    brilho-dourado
    8s
    ease-in-out
    infinite;

    z-index:0;

    pointer-events:none;

}


/* =====================================================
   CONTEÚDO
===================================================== */

.container{

    position:relative;

    padding:
    20px
    20px
    60px
    20px;

    text-align:center;

    z-index:1;

}


/* =====================================================
   TÍTULO
===================================================== */

.container h1{

    font-size:42px;

    color:#d4af37;

    margin-bottom:35px;

    text-shadow:
    0 0 15px rgba(212,175,55,.6),
    0 0 30px rgba(212,175,55,.3);

    animation:
    pulse-glow
    3s
    ease-in-out
    infinite;

}


/* =====================================================
   TABELA
===================================================== */

.table-wrapper{

    display:flex;

    justify-content:center;

    margin-top:30px;

}


table{

    width:95%;

    max-width:800px;

    border-collapse:separate;

    border-spacing:0;

    background:#000;

    border:2px solid;

    border-image:
    linear-gradient(

        #d4af37,

    ) 1;

    border-radius:20px;

    overflow:hidden;

    backdrop-filter:blur(4px);

    box-shadow:
    0 0 30px
    rgba(212,175,55,.3);

    animation:
    pulse-glow
    4s
    ease-in-out
    infinite;

}


th,
td{

    padding:15px;

    border-bottom:
    1px solid
    rgba(255,215,0,.3);

}


th{

    background:
    linear-gradient(
        90deg,
        rgba(212,175,55,.1),
        rgba(212,175,55,.2),
        rgba(212,175,55,.1)
    );

    text-shadow:
    0 0 10px
    rgba(212,175,55,.5);

}


tr:hover{

    background:
    rgba(212,175,55,.05);

    transition:.3s ease;

}


tr:last-child td{

    border-bottom:none;

}


/* =====================================================
   BOTÃO AGENDAR
===================================================== */

.agendar-btn{

    display:inline-block;

    background:

        #d4af37,
        #f7e08a
    );

    10px 18px;

    border-radius:30px;

    text-decoration:none;

    transition:.3s ease;

    font-weight:bold;

    border:none;

    cursor:pointer;

}


.agendar-btn:hover{

    box-shadow:
    0 0 30px
    rgba(212,175,55,1);

}


.agendar-btn:active{

}


/* =====================================================
   BANNER PROMOÇÃO
===================================================== */

.promo-banner{

    margin:40px auto;

    width:95%;

    max-width:800px;

    background:

    3s
    ease-in-out
    infinite;

    position:relative;

    overflow:hidden;

}


.promo-banner::before{

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:

        transparent,

    );

}


.promo-banner h2{

/* =====================================================
   TÍTULO TABELA
===================================================== */

.tabela-titulo{

    margin-bottom:20px;

}


/* =====================================================
   GALERIA
===================================================== */

.galeria{

    width:95%;

    max-width:800px;

    margin:50px auto;

    text-align:center;

    position:relative;

    z-index:2;

}


.galeria h2{

    color:#d4af37;

    font-size:28px;

    margin-bottom:25px;

    text-shadow:
    0 0 15px
    rgba(212,175,55,.6);

}


/* =====================================================
   CARROSSEL
===================================================== */

.carrossel{

    position:relative;

    width:100%;

    aspect-ratio:4 / 5;

    overflow:hidden;

    border-radius:25px;

    border:
    2px solid
    #d4af37;

    box-shadow:
    0 0 30px
    rgba(212,175,55,.4);

    background:#050505;

    /*
     * Impede o navegador de interpretar
     * o arrastar como scroll da página.
     */

    touch-action:pan-y;

    cursor:grab;

}


.carrossel:active{

    cursor:grabbing;

}


.carrossel img{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0;

    transition:
    opacity .5s ease;

    display:block;

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;

}


.carrossel img.ativo{

    opacity:1;

}


/* =====================================================
   ERRO DE IMAGEM
===================================================== */

.galeria-erro{

    padding:30px 15px;

    color:#d4af37;

    font-size:16px;

    text-align:center;

}


/* =====================================================
   BOLINHAS
===================================================== */

.bolinhas{

    margin-top:15px;

}


.bolinhas span{

    display:inline-block;

    width:10px;
    height:10px;

    margin:5px;

    border-radius:50%;

    background:#555;

    cursor:pointer;

    transition:.3s;

}


.bolinhas span.ativa{

    background:#d4af37;

    box-shadow:
    0 0 10px
    #d4af37;

    transform:scale(1.2);

}


/* =====================================================
   RODAPÉ
===================================================== */

footer{

    text-align:center;

    padding:30px;

    color:#aaa;

    position:relative;

    z-index:1;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:768px){

    }

    }


    .promo-banner p{

    .glow-left,

        width:300px;

    }

    }

        font-size:24px;

}


/* =====================================================
   IOS SAFE AREA
===================================================== */

@supports(padding:max(0px)){

        padding-top:
        env(safe-area-inset-top);

        padding-bottom:
        env(safe-area-inset-bottom);

    }

}

<script>


/* =====================================================
   WHATSAPP
===================================================== */

function agendar(servico){

    const numeroWhatsApp =
        "5531998009842";


    const mensagem =
        `Olá! Gostaria de agendar: ${servico}`;


    const url =
        "https://wa.me/"
        + numeroWhatsApp
        + "?text="
        + encodeURIComponent(mensagem);


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   PARTÍCULAS DOURADAS
===================================================== */

const particlesContainer =
    document.getElementById(
        "particles"
    );


function criarParticula(){

    const particle =
        document.createElement("div");


    particle.className =
        "particle";


    const tamanho =
        Math.random() * 6 + 2;


    particle.style.width =
        tamanho + "px";


    particle.style.height =
        tamanho + "px";


    particle.style.left =
        Math.random()
        * window.innerWidth
        + "px";


    particle.style.bottom =
        "-10px";


    const duracao =
        Math.random() * 15 + 10;


    particle.style.animationDuration =
        duracao + "s";


    particle.style.animationDelay =
        Math.random() * 5
        + "s";


    particlesContainer.appendChild(
        particle
    );


    setTimeout(() => {

        particle.remove();

    }, (duracao + 5) * 1000);

}


setInterval(
    criarParticula,
    500
);


for(let i = 0; i < 15; i++){

    criarParticula();

}


/* =====================================================
   GALERIA
===================================================== */

let imagens = [];

let bolinhas = [];

let indice = 0;

let intervalo = null;


/* =====================================================
   CARREGAR FOTOS.JSON
===================================================== */

async function carregarGaleria(){

    const carrossel =
        document.getElementById(
            "carrossel"
        );


    const dots =
        document.getElementById(
            "bolinhas"
        );


    try{

        const resposta =
            await fetch(
                "./fotos.json?v="
                + Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!resposta.ok){

            throw new Error(
                "Não foi possível carregar fotos.json"
            );

        }


        const dados =
            await resposta.json();


        if(
            !dados ||
            !Array.isArray(dados.fotos)
        ){

            throw new Error(
                "O fotos.json não possui uma lista de fotos válida."
            );

        }


        if(
            dados.fotos.length === 0
        ){

            throw new Error(
                "Nenhuma foto foi encontrada."
            );

        }


        carrossel.innerHTML = "";

        dots.innerHTML = "";


        dados.fotos.forEach(
            (foto, i) => {


                let nomeFoto =
                    String(foto).trim();


                /*
                 * Fotos estão na raiz.
                 */

                if(
                    !nomeFoto.startsWith("./") &&
                    !nomeFoto.startsWith("/") &&
                    !nomeFoto.startsWith("http")
                ){

                    nomeFoto =
                        "./"
                        + nomeFoto;

                }


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    nomeFoto;


                img.alt =
                    "Trabalho Bia Nails";


                img.draggable =
                    false;


                img.loading =
                    i === 0
                    ? "eager"
                    : "lazy";


                img.decoding =
                    "async";


                if(i === 0){

                    img.classList.add(
                        "ativo"
                    );

                }


                img.addEventListener(
                    "error",
                    () => {

                        console.error(
                            "Erro ao carregar:",
                            nomeFoto
                        );

                    }
                );


                carrossel.appendChild(
                    img
                );


                const dot =
                    document.createElement(
                        "span"
                    );


                if(i === 0){

                    dot.classList.add(
                        "ativa"
                    );

                }


                dot.addEventListener(
                    "click",
                    () => {

                        trocar(i);

                        reiniciarTemporizador();

                    }
                );


                dots.appendChild(
                    dot
                );

            }
        );


        imagens =
            carrossel.querySelectorAll(
                "img"
            );


        bolinhas =
            dots.querySelectorAll(
                "span"
            );


        indice = 0;


        if(
            imagens.length > 1
        ){

            iniciarTemporizador();

        }


        console.log(
            "Galeria carregada:",
            imagens.length,
            "fotos."
        );


    }catch(erro){

        console.error(
            "Erro na galeria:",
            erro
        );


        carrossel.innerHTML = `

            <div class="galeria-erro">

                ✨ Não foi possível carregar
                as fotos da galeria.

                <br><br>

                Verifique o arquivo
                <strong>fotos.json</strong>.

            </div>

        `;

    }

}


/* =====================================================
   TEMPORIZADOR — 8 SEGUNDOS
===================================================== */

function iniciarTemporizador(){

    pararTemporizador();


    intervalo =
        setInterval(
            proxima,
            8000
        );

}


/* =====================================================
   REINICIAR TEMPORIZADOR
===================================================== */

function reiniciarTemporizador(){

    if(
        imagens.length > 1
    ){

        iniciarTemporizador();

    }

}


/* =====================================================
   PARAR TEMPORIZADOR
===================================================== */

function pararTemporizador(){

    if(intervalo){

        clearInterval(
            intervalo
        );

        intervalo = null;

    }

}


/* =====================================================
   TROCAR FOTO
===================================================== */

function trocar(numero){

    if(
        !imagens ||
        !imagens.length
    ){

        return;

    }


    if(
        numero < 0 ||
        numero >= imagens.length
    ){

        return;

    }


    imagens[indice]
        .classList
        .remove("ativo");


    if(bolinhas[indice]){

        bolinhas[indice]
            .classList
            .remove("ativa");

    }


    indice =
        numero;


    imagens[indice]
        .classList
        .add("ativo");


    if(bolinhas[indice]){

        bolinhas[indice]
            .classList
            .add("ativa");

    }

}


/* =====================================================
   PRÓXIMA FOTO
===================================================== */

function proxima(){

    if(
        !imagens ||
        !imagens.length
    ){

        return;

    }


    trocar(
        (indice + 1)
        % imagens.length
    );

}


/* =====================================================
   FOTO ANTERIOR
===================================================== */

function anterior(){

    if(
        !imagens ||
        !imagens.length
    ){

        return;

    }


    trocar(
        (indice - 1 + imagens.length)
        % imagens.length
    );

}


/* =====================================================
   DESLIZAR COM O DEDO
   ANDROID / IPHONE
===================================================== */

let inicioX = 0;

let fimX = 0;


const carrossel =
    document.getElementById(
        "carrossel"
    );


carrossel.addEventListener(
    "touchstart",
    evento => {

        inicioX =
            evento.touches[0].clientX;

    },
    {
        passive:true
    }
);


carrossel.addEventListener(
    "touchend",
    evento => {

        fimX =
            evento.changedTouches[0].clientX;


        const distancia =
            fimX - inicioX;


        /*
         * Deslizou para a esquerda
         */

        if(
            distancia < -50
        ){

            proxima();

            reiniciarTemporizador();

        }


        /*
         * Deslizou para a direita
         */

        else if(
            distancia > 50
        ){

            anterior();

            reiniciarTemporizador();

        }

    },
    {
        passive:true
    }
);


/* =====================================================
   ARRASTAR COM MOUSE
   COMPUTADOR
===================================================== */

let mousePressionado = false;

let mouseInicioX = 0;


carrossel.addEventListener(
    "mousedown",
    evento => {

        mousePressionado = true;

        mouseInicioX =
            evento.clientX;

    }
);


carrossel.addEventListener(
    "mouseup",
    evento => {

        if(!mousePressionado){

            return;

        }


        mousePressionado = false;


        const distancia =
            evento.clientX
            - mouseInicioX;


        if(
            distancia < -50
        ){

            proxima();

            reiniciarTemporizador();

        }


        else if(
            distancia > 50
        ){

            anterior();

            reiniciarTemporizador();

        }

    }
);


carrossel.addEventListener(
    "mouseleave",
    () => {

        mousePressionado = false;

    }
);


/* =====================================================
   INICIAR GALERIA
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        carregarGaleria();

    }
);


/* =====================================================
   SERVICE WORKER / PWA
===================================================== */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )

                .then(
                    registro => {

                        console.log(
                            "Bia Nails PWA ativo"
                        );


                        console.log(
                            "Service Worker:",
                            registro
                        );

                    }
                )

                .catch(
                    erro => {

                        console.log(
                            "Erro PWA:",
                            erro
                        );

                    }
                );

        }
    );

}

</script>
